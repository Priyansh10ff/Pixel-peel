[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ─────────────────────────────────────────────────────────────
[project]
name            = "pixelpeel"
version         = "1.0.0"
description     = "AI-powered local background remover — 100% offline, zero cloud"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.9"

keywords = [
    "background-removal", "image-processing", "ai", "rembg",
    "desktop-app", "local", "offline", "customtkinter",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "rembg>=2.0.57",
    "onnxruntime>=1.17.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "customtkinter>=5.2.2",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17.0"]
dnd = ["tkinterdnd2>=0.3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "black>=24.0",
]

[project.scripts]
pixelpeel = "main:main"

[project.urls]
Homepage      = "https://github.com/yourusername/pixelpeel"
Repository    = "https://github.com/yourusername/pixelpeel"
"Bug Tracker" = "https://github.com/yourusername/pixelpeel/issues"

# ─────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ─────────────────────────────────────────────────────────────
[tool.black]
line-length    = 90
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 90
select      = ["E", "F", "I", "W", "UP"]
ignore      = ["E501"]

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short --cov=src --cov-report=term-missing"
